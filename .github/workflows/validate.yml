name: Skill delivery validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: python scripts/skillctl.py validate
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/webrtc.test.cjs
      - run: git diff --check
